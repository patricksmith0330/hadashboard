            cards:
              - type: custom:stack-in-card
                mode: horizontal
                cards:
                  - type: vertical-stack
                    cards:
                      - type: custom:mushroom-legacy-template-card
                        primary: Main Bedroom
                        secondary: >-
                          {{
                          states('sensor.main_bedroom_sensor_temperature')|round(0)
