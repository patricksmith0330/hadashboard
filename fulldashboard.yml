      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#tesla'
            button_type: name
            name: Qidi X-Max 3
            icon: phu:3dprinter-standby
            sub_button:
              main: []
              bottom: []
            show_header: true
            auto_close: '0'
            margin: 7px
            close_on_click: false
            card_layout: normal
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:button-card
                    show_state: true
                    tap_action:
                      action: none
                    custom_fields:
                      printer_camera:
                        card:
                          type: picture-entity
                          entity: camera.creality_k1c
                          camera_image: camera.creality_k1c
                          camera_view: live
                          show_name: false
                          show_state: false
                          card_mod:
                            style: |
                              ha-card {
                                background-color: transparent;
                                border: none;
                                filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.1));
                                transition: all 0.3s ease;
                              }
                              ha-card:hover {
                                filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.2));
                                transform: scale(1.01);
                              }
                      progress_info:
                        card:
                          type: custom:mushroom-template-card
                          primary: '{{ states(''sensor.mkspi_progress'') }}%'
                          secondary: Progress
                          card_mod:
                            style:
                              mushroom-state-info$: |
                                .primary {
                                  font-size: clamp(14px, 2vw, 18px) !important;
                                  font-weight: 700 !important;
                                  color: white !important;
                                  text-align: center !important;
                                  text-shadow: 0 0 10px rgba(255, 255, 255, 0.3) !important;
                                }
                                .secondary {
                                  font-size: clamp(10px, 1.5vw, 14px) !important;
                                  color: rgba(255, 255, 255, 0.8) !important;
                                  text-align: center !important;
                                  text-shadow: 0 0 5px rgba(255, 255, 255, 0.2) !important;
                                }
                              .: |
                                ha-card {
                                  background: transparent !important;
                                  border: none !important;
                                  box-shadow: none !important;
                                  text-align: center !important;
                                }
                      filament_info:
                        card:
                          type: custom:mushroom-template-card
                          primary: '{{ states(''sensor.mkspi_filament_used'') }} m'
