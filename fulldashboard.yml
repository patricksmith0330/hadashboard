                          {% if is_state('switch.sofa_lamp', 'on') or
                          is_state('media_player.lg_webos_2', 'on') %} 
                            #2973B2 
                          {% else %}
                            #7A7A7F 
                          {% endif %}
                        primary_info: none
                        secondary_info: none
                        card_mod:
                          style:
                            mushroom-shape-icon$: |
                              .shape {
                                --icon-size: 135px;
                              }
                            .: |
                              ha-card {
                                border: 0px;
                                margin-left: -30px;
                                margin-top: -20px;

                              }
                  - type: custom:mushroom-chips-card
                    chips:
                      - type: template
                        entity: switch.sofa_lamp
                        tap_action:
                          action: toggle
                        hold_action:
                          action: more-info
                        double_tap_action:
                          action: more-info
                        icon: mdi:lightbulb-group
                        card_mod:
                          style: |
                            ha-card {
                              --chip-background: {% if is_state('switch.sofa_lamp', 'on') %} #2973B2 {% else %} #353535 {% endif %};
                              --color: {% if is_state('switch.sofa_lamp', 'on') %} #ffffff {% else %} #ebeaea {% endif %};
                              justify-content: center;
                              height: 35px !important;
                              width: 35px !important;
                              border: 0 !important;
                              box-shadow: none !important;
                              border-radius: 22px !important;
                            }
                      - type: template
                        entity: input_boolean.movie
                        tap_action:
                          action: navigate
                          navigation_path: '#remote'
                        hold_action:
                          action: more-info
                        double_tap_action:
                          action: none
                        icon: phu:appletv-gen2-remote
                        icon_color: white
                        card_mod:
                          style: |
                            ha-card {
                              --chip-background: #353535;
                              justify-content: center;
                              height: 35px !important;
                              width: 35px !important;
                              border: 0 !important;
                              box-shadow: none !important;
                              border-radius: 22px !important;
                            }
                    card_mod:
                      style: |
                        .chip-container {
                          flex-flow: column wrap-reverse !important;
                          display: flex !important;
                          --chip-spacing: 8px;
                          margin: 12px;
                        }
                        .: |
                        .container {
                          align: end;
                        }
                card_mod:
                  style: |
                    ha-card {
                      max-width: 100%;
                      min-width: 50%;
                      height: 186px;
                    }
              - type: custom:stack-in-card
                mode: horizontal
                cards:
                  - type: vertical-stack
                    cards:
                      - type: custom:mushroom-legacy-template-card
                        primary: Kitchen
                        secondary: >-
                          {{
