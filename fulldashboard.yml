                          {{
                          states('sensor.living_room_sensor_temperature')|round(0)
                          }}°F | {{
                          states('sensor.living_room_sensor_humidity')|round(0)
                          }}%
                        card_mod:
                          style:
                            mushroom-shape-icon$: |
                              .shape {
                                display: none !important;
                              }
                            .: |
                              ha-card {

                                border: 0px;
                                padding-left: 10px;
                                padding-top: 10px;
                                width: 500px;
                              }
                      - type: custom:mushroom-legacy-template-card
                        entity: switch.sofa_lamp
                        layout: horizontal
                        icon: mdi:sofa-outline
                        tap_action:
                          action: navigate
                          navigation_path: /dashboard-mobile/living_room
                        hold_action:
                          action: more-info
                        double_tap_action:
                          action: more-info
