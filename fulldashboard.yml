kiosk_mode:
  non_admin_settings:
    kiosk: true
  hide_header: '[[[ return is_state("input_boolean.kiosk_mode", "on") ]]]'
views:
  - title: Home
    sections:
      - type: grid
        cards:
          - type: custom:stack-in-card
            card_mod:
              style: |
                ha-card {
                  border-radius: 20px;
                  padding: 5px;
                }
            cards:
              - type: custom:mushroom-title-card
                title: |-
                  {%- if now().hour < 12 -%}Good Morning
                  {%- elif now().hour < 18 -%}Good Afternoon
                  {%- else -%}Good Evening{%- endif -%},
                  {{user}}
                card_mod:
                  style: |
                    ha-card {
                      font-weight: 500 !important;
                    }
                    ha-card * {
                      font-weight: 500 !important;
                    }
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-legacy-template-card
                    entity: alarm_control_panel.vivint
                    icon: >
                      {% set alarm_state = states(entity) %} {% if alarm_state
                      == 'disarmed' %}mdi:shield-off {% elif alarm_state ==
                      'armed_home' %}mdi:shield-home {% elif alarm_state ==
                      'armed_away' %}mdi:shield-lock {% elif alarm_state ==
                      'armed_night' %}mdi:shield-moon {% elif alarm_state ==
                      'triggered' %}mdi:bell-ring-outline {% else
                      %}mdi:shield-outline {% endif %}
                    icon_color: >
                      {% set alarm_state = states(entity) %} {% if alarm_state
                      in ['disarmed', 'armed_home', 'armed_away', 'armed_night',
                      'triggered'] %}purple{% else %}blue{% endif %}
                    layout: vertical
                    primary: Vivint
                    tap_action:
                      action: navigate
                      navigation_path: '#vivint'
                    card_mod:
                      style: |
                        ha-card {
                          --icon-size: 40px;
                          --card-primary-font-size: 12px;
                          --card-secondary-font-size: 14px;
                          border-radius: 0px;
                        }
                        mushroom-shape-icon {
                          width: 50px;
                          height: 50px;
                          border-radius: 50%;
                          background-color: transparent;
                          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
                          display: flex;
                          align-items: center;
                          justify-content: center;
                        }
                  - type: custom:mushroom-legacy-template-card
                    icon: >
                      {% if is_state('binary_sensor.front_door','off')
                      %}mdi:door-closed-lock{% else %}mdi:door-open{% endif %}
                    icon_color: >
                      {% if is_state('binary_sensor.front_door','off') %}green{%
                      else %}red{% endif %}
                    layout: vertical
                    primary: Secure
                    entity: binary_sensor.front_door
                    tap_action:
                      action: navigate
                      navigation_path: secure
                    card_mod:
                      style: |
                        ha-card {
                          --icon-size: 40px;
                          --card-primary-font-size: 12px;
                          --card-secondary-font-size: 14px;
                          border-radius: 0px;
                        }
                        mushroom-shape-icon {
                          width: 50px;
                          height: 50px;
                          border-radius: 50%;
                          background-color: transparent;
                          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
                          display: flex;
                          align-items: center;
                          justify-content: center;
                        }
                  - type: custom:mushroom-legacy-template-card
                    icon: phu:proxmox
                    icon_color: orange
                    layout: vertical
                    primary: Homelab
                    entity: sensor.system_monitor_processor_use
                    tap_action:
                      action: navigate
                      navigation_path: /dashboard-mobile/homelab
                    card_mod:
                      style: |
                        ha-card {
                          --icon-size: 40px;
                          --card-primary-font-size: 12px;
                          --card-secondary-font-size: 14px;
                          border-radius: 0px;
                        }
                        mushroom-shape-icon {
                          width: 50px;
                          height: 50px;
                          border-radius: 50%;
                          background-color: transparent;
                          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
                          display: flex;
                          align-items: center;
                          justify-content: center;
                        }
                  - type: custom:mushroom-legacy-template-card
                    icon: mdi:printer-3d
                    icon_color: red
                    layout: vertical
                    primary: Printer
                    entity: sensor.mkspi_toolhead_position_x
                    tap_action:
                      action: navigate
                      navigation_path: '#tesla'
                    card_mod:
                      style: |
                        ha-card {
                          --icon-size: 40px;
                          --card-primary-font-size: 12px;
                          --card-secondary-font-size: 14px;
                          border-radius: 0px;
                        }
                        mushroom-shape-icon {
                          width: 50px;
                          height: 50px;
                          border-radius: 50%;
                          background-color: transparent;
                          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
                          display: flex;
                          align-items: center;
                          justify-content: center;
                        }
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-person-card
                entity: person.patrick
                icon_type: entity-picture
                fill_container: false
                hold_action:
                  action: none
                double_tap_action:
                  action: none
              - type: custom:mushroom-template-card
                primary: '{{ states(''weather.openweathermap'')}}'
                secondary: '{{ states(''sensor.openweathermap_temperature'') | round }}'
                icon: >-
                  {% if states('weather.openweathermap') == 'clear-night' %}
                    mdi:weather-night
                  {% elif states('weather.openweathermap') == 'cloudy' %}
                    mdi:weather-cloudy
                  {% elif states('weather.openweathermap') == 'fog' %}
                    mdi:weather-fog
                  {% elif states('weather.openweathermap') == 'hail' %}
                    mdi:weather-hail
                  {% elif states('weather.openweathermap') == 'lightning' %}
                    mdi:weather-lightning
                  {% elif states('weather.openweathermap') == 'lightning-rainy'
                  %}
                    mdi:weather-lightning-rainy
                  {% elif states('weather.openweathermap') == 'partlycloudy' %}
                    mdi:weather-partly-cloudy
                  {% elif states('weather.openweathermap') == 'pouring' %}
                    mdi:weather-pouring
                  {% elif states('weather.openweathermap') == 'rainy' %}
                    mdi:weather-rainy
                  {% elif states('weather.openweathermap') == 'snowy' %}
                    mdi:weather-snowy
                  {% elif states('weather.openweathermap') == 'snowy-rainy' %}
                    mdi:weather-snowy-rainy
                  {% elif states('weather.openweathermap') == 'sunny' %}
                    mdi:weather-sunny
                  {% elif states('weather.openweathermap') == 'windy' %}
                    mdi:weather-windy
                  {% elif states('weather.openweathermap') == 'windy-variant' %}
                    mdi:weather-windy-variant
                  {% elif states('weather.openweathermap') == 'exceptional' %}
                    mdi:alert-circle-outline
                  {% else %}
                    mdi:help-circle-outline
                  {% endif %}
                entity: weather.openweathermap
                icon_color: >+
                  {% set temp = states('sensor.openweathermap_temperature') |
                  regex_replace('°F', '') | int %}


                  {% if temp < 20 %}
                    blue
                  {% elif temp < 40 %}
                    #9ACBD0
                  {% elif temp < 60 %}
                    green
                  {% elif temp < 80 %}
                    yellow
                  {% elif temp < 100 %}
                    red
                  {% else %}
                    darkred
                  {% endif %}

                tap_action:
                  action: more-info
                badge_color: ''
                badge_icon: ''
          - type: custom:vertical-stack-in-card
            cards:
              - entities:
                  - color: '#C62300'
                    label: Patrick |
                    accent_color: '#C62300'
                    entity: calendar.patricksmith0330_gmail_com
                    show_time: true
                  - entity: calendar.trash_pickup
                  - entity: calendar.holidays_in_united_states
                    color: '#d4b02c'
                    accent_color: '#d4b02c'
                  - entity: calendar.birthdays
                    color: '#DE3163'
                    accent_color: '#DE3163'
                days_to_show: 2
                compact_events_to_show: 5
                filter_duplicates: true
                today_indicator: pulse
                weekend_weekday_color: '#C62E2E'
                weekend_day_color: '#C62E2E'
                weekend_month_color: '#C62E2E'
                today_weekday_color: '#03a9f4'
                today_day_color: '#03a9f4'
                today_month_color: '#03a9f4'
                empty_day_color: var(--secondary-text-color)
                time_24h: false
                weather:
                  position: date
                  date:
                    show_conditions: true
                    show_high_temp: true
                    show_low_temp: false
                    icon_size: 14px
                    font_size: 12px
                    color: var(--primary-text-color)
                  event:
                    show_conditions: true
                    show_temp: true
                    icon_size: 14px
                    font_size: 12px
                    color: var(--primary-text-color)
                tap_action:
                  action: expand
                type: custom:calendar-card-pro
              - type: markdown
                content: '{{ states(''input_text.hourly_weather'') or ''—'' }}'
          - type: horizontal-stack
            cards:
              - type: custom:stack-in-card
                mode: horizontal
                cards:
                  - type: vertical-stack
                    cards:
                      - type: custom:mushroom-legacy-template-card
                        primary: Living Room
